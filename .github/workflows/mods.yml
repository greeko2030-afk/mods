
name: Automatic Optimization Mods Downloader

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - "Mods.yml"
      - ".github/workflows/mods.yml"
      - ".github/scripts/download_mods.py"

permissions:
  contents: write

concurrency:
  group: optimization-mods
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install requests pyyaml

      - name: Download mods
        run: python .github/scripts/download_mods.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/
          if ! git diff --cached --quiet; then
            git commit -m "Update Minecraft optimization mods"
            git push
          else
            echo "No mod changes."
          fi
